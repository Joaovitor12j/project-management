# Ambiente de desenvolvimento com o código montado em /app.
# Uso: docker compose -f docker-compose.dev.yml up -d
name: project-management

volumes:
  mysql_data:

x-app: &app
  image: helper-app:dev
  build:
    context: docker/dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  volumes:
    - .:/app
  environment:
    DB_CONNECTION: mysql
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: helper
    DB_USERNAME: helper
    DB_PASSWORD: helper
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: mysql:8.0
    container_name: helper-mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: helper
      MYSQL_USER: helper
      MYSQL_PASSWORD: helper
      MYSQL_ROOT_PASSWORD: helper
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    <<: *app
    container_name: helper-app
    ports:
      - "8000:8000"
    restart: unless-stopped

  queue:
    <<: *app
    container_name: helper-queue
    command: php artisan queue:work --tries=3
    restart: unless-stopped
